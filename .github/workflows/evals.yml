name: Evaluations

on:
  pull_request:
    labels: [run-evals]
  workflow_dispatch:
    inputs:
      runners:
        description: "Comma-separated runner names (or 'all')"
        required: false
        default: "all"

jobs:
  eval-suite:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    # Only run when explicitly requested via label or manual dispatch
    if: >
      github.event_name == 'workflow_dispatch' ||
      contains(github.event.pull_request.labels.*.name, 'run-evals')

    env:
      GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
      GCP_LOCATION: ${{ secrets.GCP_LOCATION }}
      QDRANT_URL: ${{ secrets.QDRANT_URL }}
      GUARDRAILS_SERVICE_URL: ${{ secrets.GUARDRAILS_SERVICE_URL }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .

      - name: Run evaluations
        run: make eval-all

      - name: Check for regressions
        run: make eval-regression

      - name: Upload eval reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eval-reports
          path: data/eval/reports/
          retention-days: 30

      - name: Post PR summary
        if: github.event_name == 'pull_request' && always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const glob = require('glob');

            // Find the latest markdown report
            const mdFiles = fs.readdirSync('data/eval/reports/')
              .filter(f => f.endsWith('.md'))
              .sort()
              .reverse();

            if (mdFiles.length > 0) {
              const report = fs.readFileSync(`data/eval/reports/${mdFiles[0]}`, 'utf8');
              // Truncate if too long for a PR comment
              const truncated = report.length > 60000
                ? report.slice(0, 60000) + '\n\n... (truncated)'
                : report;

              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: `## 📊 Evaluation Report\n\n${truncated}`
              });
            }
