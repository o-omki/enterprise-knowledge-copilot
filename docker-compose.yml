services:
  api:
    image: python:3.11
    working_dir: /workspace
    volumes:
      - ./:/workspace
      - ~/.config/gcloud:/root/.config/gcloud:ro
    command: >
      bash -lc "pip install --upgrade pip && pip install -e .[dev] &&
      uvicorn apps.api.app.main:app --host 0.0.0.0 --port 8000 --reload"
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - QDRANT_URL=http://qdrant:6333
      - POSTGRES_DSN=postgresql://postgres:postgres@postgres:5432/knowledge_copilot
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/1
      - REDIS_URL=redis://redis:6379/0
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://jaeger:4317
      - OTEL_EXPORTER_OTLP_INSECURE=true
    depends_on:
      - qdrant
      - postgres
      - jaeger
      - guardrails
      - redis

  guardrails:
    image: python:3.11
    working_dir: /workspace
    volumes:
      - ./:/workspace
      - ~/.config/gcloud:/root/.config/gcloud:ro
    command: >
      bash -lc "pip install --upgrade pip && pip install -e .[dev] &&
      uvicorn apps.guardrails.main:app --host 0.0.0.0 --port 8001 --reload"
    ports:
      - "8001:8001"
    env_file:
      - .env
    environment:
      - NEMOGUARDRAILS_LLM_FRAMEWORK=langchain
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://jaeger:4317
      - OTEL_EXPORTER_OTLP_INSECURE=true
    depends_on:
      - jaeger

  jaeger:
    image: jaegertracing/all-in-one:latest
    ports:
      - "16686:16686" # Web UI
      - "4317:4317"   # OTLP gRPC receiver
      - "4318:4318"   # OTLP HTTP receiver
    environment:
      - COLLECTOR_OTLP_ENABLED=true

  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage

  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: knowledge_copilot
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  worker:
    image: python:3.11
    working_dir: /workspace
    volumes:
      - ./:/workspace
      - ~/.config/gcloud:/root/.config/gcloud:ro
    command: >
      bash -lc "pip install --upgrade pip && pip install -e .[dev] &&
      celery -A apps.worker.celery_app worker --loglevel=info"
    env_file:
      - .env
    environment:
      - QDRANT_URL=http://qdrant:6333
      - POSTGRES_DSN=postgresql://postgres:postgres@postgres:5432/knowledge_copilot
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/1
    depends_on:
      - redis
      - qdrant
      - postgres

  frontend:
    image: node:20-alpine
    working_dir: /workspace/apps/frontend
    volumes:
      - ./:/workspace
    command: >
      sh -c "npm install && npm run dev"
    ports:
      - "3000:3000"
    env_file:
      - .env
    depends_on:
      - api

  locust:
    image: python:3.11
    working_dir: /workspace
    volumes:
      - ./:/workspace
    command: >
      bash -lc "pip install --upgrade pip && pip install -e .[dev] &&
      locust -f scripts/load_test.py --host http://api:8000"
    ports:
      - "8089:8089"
    env_file:
      - .env
    depends_on:
      - api

  prometheus:
    image: prom/prometheus:latest
    volumes:
      - ./infra/monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./infra/monitoring/prometheus/alert_rules.yml:/etc/prometheus/alert_rules.yml:ro
    ports:
      - "9090:9090"
    depends_on:
      - api

  grafana:
    image: grafana/grafana:latest
    volumes:
      - ./infra/monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Viewer
    depends_on:
      - prometheus

volumes:
  postgres_data:
  qdrant_data:


