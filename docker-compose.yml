services:
  api:
    image: python:3.11
    working_dir: /workspace
    volumes:
      - ./:/workspace
      - ~/.config/gcloud:/root/.config/gcloud:ro
    command: >
      bash -lc "pip install --upgrade pip && pip install -e .[dev] &&
      uvicorn apps.api.app.main:app --host 0.0.0.0 --port 8000 --reload"
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - QDRANT_URL=http://qdrant:6333
      - POSTGRES_DSN=postgresql://postgres:postgres@postgres:5432/knowledge_copilot
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://jaeger:4317
      - OTEL_EXPORTER_OTLP_INSECURE=true
    depends_on:
      - qdrant
      - postgres
      - jaeger
      - guardrails

  guardrails:
    image: python:3.11
    working_dir: /workspace
    volumes:
      - ./:/workspace
      - ~/.config/gcloud:/root/.config/gcloud:ro
    command: >
      bash -lc "pip install --upgrade pip && pip install -e .[dev] &&
      uvicorn apps.guardrails.main:app --host 0.0.0.0 --port 8001 --reload"
    ports:
      - "8001:8001"
    env_file:
      - .env
    environment:
      - NEMOGUARDRAILS_LLM_FRAMEWORK=langchain
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://jaeger:4317
      - OTEL_EXPORTER_OTLP_INSECURE=true
    depends_on:
      - jaeger

  jaeger:
    image: jaegertracing/all-in-one:latest
    ports:
      - "16686:16686" # Web UI
      - "4317:4317"   # OTLP gRPC receiver
      - "4318:4318"   # OTLP HTTP receiver
    environment:
      - COLLECTOR_OTLP_ENABLED=true

  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"
      - "6334:6334"

  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: knowledge_copilot
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

volumes:
  postgres_data:
