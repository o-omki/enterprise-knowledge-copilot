apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: ekc-staging
namePrefix: staging-

resources:
  - ../../base

patches:
  - path: patches/replicas.yaml
  - path: patches/resources.yaml
  - path: patches/configmap.yaml
  - target:
      kind: Namespace
      name: ekc
    patch: |-
      - op: replace
        path: /metadata/name
        value: ekc-staging
