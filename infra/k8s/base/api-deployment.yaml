apiVersion: apps/v1
kind: Deployment
metadata:
  name: ekc-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: ekc-api
  template:
    metadata:
      labels:
        app: ekc-api
    spec:
      serviceAccountName: ekc-workload-sa
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001
      containers:
        - name: api
          image: ekc-api:latest
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: false
          ports:
            - containerPort: 8000
              name: http
          envFrom:
            - configMapRef:
                name: ekc-config
          env:
            - name: GEMINI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: ekc-secrets
                  key: GEMINI_API_KEY
            - name: JWT_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: ekc-secrets
                  key: JWT_SECRET_KEY
            - name: POSTGRES_DSN
              valueFrom:
                secretKeyRef:
                  name: ekc-secrets
                  key: POSTGRES_DSN
            - name: DEFAULT_API_KEY
              valueFrom:
                secretKeyRef:
                  name: ekc-secrets
                  key: DEFAULT_API_KEY
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: 1000m
              memory: 1Gi
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 10
      terminationGracePeriodSeconds: 30
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: ekc-api
