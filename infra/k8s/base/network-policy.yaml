apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-all
  namespace: ekc
spec:
  podSelector: {}
  policyTypes:
    - Ingress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-frontend-to-api
  namespace: ekc
spec:
  podSelector:
    matchLabels:
      app: ekc-api
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: ekc-frontend
      ports:
        - protocol: TCP
          port: 8000
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-api-connections
  namespace: ekc
spec:
  podSelector:
    matchLabels:
      app: ekc-api
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: ekc-prometheus
      ports:
        - protocol: TCP
          port: 8000
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-guardrails-connections
  namespace: ekc
spec:
  podSelector:
    matchLabels:
      app: ekc-guardrails
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: ekc-api
        - podSelector:
            matchLabels:
              app: ekc-prometheus
      ports:
        - protocol: TCP
          port: 8001
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-qdrant-connections
  namespace: ekc
spec:
  podSelector:
    matchLabels:
      app: ekc-qdrant
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: ekc-api
        - podSelector:
            matchLabels:
              app: ekc-worker
      ports:
        - protocol: TCP
          port: 6333
        - protocol: TCP
          port: 6334
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-redis-connections
  namespace: ekc
spec:
  podSelector:
    matchLabels:
      app: ekc-redis
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: ekc-api
        - podSelector:
            matchLabels:
              app: ekc-worker
      ports:
        - protocol: TCP
          port: 6379
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-jaeger-connections
  namespace: ekc
spec:
  podSelector:
    matchLabels:
      app: ekc-jaeger
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: ekc-api
        - podSelector:
            matchLabels:
              app: ekc-worker
        - podSelector:
            matchLabels:
              app: ekc-guardrails
      ports:
        - protocol: TCP
          port: 4317
        - protocol: TCP
          port: 4318
