[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["apps*", "packages*"]
exclude = ["data*", "docs*"]

[project]
name = "enterprise-knowledge-copilot"
version = "0.9.0"
description = "Production-grade enterprise knowledge copilot"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
  "uvicorn[standard]>=0.30.0",
  "qdrant-client[fastembed] (>=1.17.1,<2.0.0)",
  "google-genai>=1.0.0",
  "pytest>=8.3.0",
  "pytest-asyncio>=0.23.0",
  "ruff>=0.6.0",
  "pre-commit>=3.8.0",
  "pydantic-settings[dotenv]>=2.14.0",
  "google-cloud-aiplatform (>=1.149.0,<2.0.0)",
  "sentence-transformers (>=3.0.0)",
  "nemoguardrails[sdd] (>=0.22.0,<0.23.0)",
  "httpx>=0.27.0",
  "pyyaml>=6.0.0",
  "spacy (>=3.8.14,<4.0.0)",
  "langchain (>=1.3.2,<2.0.0)",
  "langchain-community (>=0.4.2,<0.5.0)",
  "langchain-google-vertexai (>=3.2.3,<4.0.0)",
  "sqlalchemy[asyncio]>=2.0.30",
  "asyncpg>=0.29.0",
  "alembic>=1.13.0",
  "redis[hiredis]>=5.0.0",
  "celery[redis]>=5.4.0",
  "sse-starlette>=2.1.0",
  "python-multipart>=0.0.19",
  "passlib (>=1.7.4,<2.0.0)",
  "bcrypt (>=5.0.0,<6.0.0)",
  "pyjwt (>=2.13.0,<3.0.0)",
  "openai (>=2.41.1,<3.0.0)",
  "locust>=2.29.0",
  "mypy (>=2.1.0,<3.0.0)",
  "structlog (>=26.1.0,<27.0.0)",
  "opentelemetry-exporter-prometheus (>=0.63b1,<0.64)",
  "prometheus-client (>=0.25.0,<0.26.0)",
  "opentelemetry-instrumentation-redis (>=0.63b1,<0.64)",
  "opentelemetry-instrumentation-sqlalchemy (>=0.63b1,<0.64)",
  "opentelemetry-instrumentation-celery (>=0.63b1,<0.64)",
  "opentelemetry-instrumentation-httpx (>=0.63b1,<0.64)",
  "opentelemetry-exporter-otlp-proto-grpc (>=1.42.1,<2.0.0)",
  "opentelemetry-instrumentation-fastapi (>=0.63b1,<0.64)",
  "opentelemetry-sdk (>=1.42.1,<2.0.0)",
  "opentelemetry-api (>=1.42.1,<2.0.0)",
  "fastapi (>=0.116.0,<0.137.0)",
]

[tool.pytest.ini_options]
testpaths = ["apps", "packages"]
python_files = ["test_*.py"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_unused_configs = true
exclude = ["data/"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
